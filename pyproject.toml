[project]
name = "time-series-mcp"
version = "0.1.0"
description = "MCP server for time series analysis and forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain_openai",
    "mcp-use",
    "mcp>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.4",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "pmdarima>=2.0.0",
    "torch>=2.0.0",
    "holidays>=0.25",
    "pydantic>=2.0.0",
]

[project.scripts]
time-series-mcp = "time_series_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

